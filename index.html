<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Familienplaner</title>
<meta name="theme-color" content="#F1F5F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101714" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Familienplaner">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: mobile-first. Sticky Kopf mit Personen-Filter, darunter eine Ansicht
   (Kalender / Aufgaben / Einkauf), unten Tab-Leiste und Schnell-Button. Eintrags-
   Formulare öffnen als Blatt von unten. Farbe gehört den Personen, die App selbst bleibt neutral. */
:root{
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Avenir Next","Segoe UI",system-ui,sans-serif;
  --bg:#F1F5F3; --surface:#FFFFFF; --surface-2:#E6ECE9; --ink:#17231F; --ink-2:#4A5B55;
  --line:#D3DDD8; --ok:#2E7D5A; --warn:#A9501A; --danger:#B3261E; --shadow:rgba(23,35,31,.16);
  --koala:#4F9174;   /* Eukalyptus */
  --loewin:#3F7BD4;  /* Blau */
  --fuchs:#F0A078;   /* Pfirsich */  --today:#7B4CC0; --on-today:#FFFFFF;  /* Hervorhebung für heute, bewusst keine Personenfarbe */
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101714; --surface:#18221E; --surface-2:#223029; --ink:#E7EFEB; --ink-2:#9DB0A8;
    --line:#2C3B34; --ok:#6CC49C; --warn:#E39A62; --danger:#F2938C; --shadow:rgba(0,0,0,.5);
    --koala:#7CC3A3; --loewin:#7DAEF2; --fuchs:#F5B795; --today:#BFA0F0; --on-today:#1D1233; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101714; --surface:#18221E; --surface-2:#223029; --ink:#E7EFEB; --ink-2:#9DB0A8;
  --line:#2C3B34; --ok:#6CC49C; --warn:#E39A62; --danger:#F2938C; --shadow:rgba(0,0,0,.5);
  --koala:#7CC3A3; --loewin:#7DAEF2; --fuchs:#F5B795; --today:#BFA0F0; --on-today:#1D1233; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:15px/1.45 var(--f-body); -webkit-text-size-adjust:100%;
  padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.shell{max-width:620px;margin:0 auto;padding-bottom:150px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
.muted{color:var(--ink-2)}
.p-koala{--c:var(--koala)} .p-loewin{--c:var(--loewin)} .p-fuchs{--c:var(--fuchs)} .p-alle{--c:var(--ink-2)}

/* Kopf */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 10px}
.top-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px}
.title-group{display:flex;align-items:center;gap:10px;min-width:0}
.top h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
.ov-count{margin:0 0 4px;color:var(--ink-2)}
.ov-aisle{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:600;margin:14px 0 4px}
.ov-list{list-style:none;margin:0;padding:0;columns:2;column-gap:18px}
.ov-list li{padding:3px 0;break-inside:avoid;overflow-wrap:anywhere}
.ov-list.done li{text-decoration:line-through;color:var(--ink-2)}
.ov-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.ov-items{display:flex;flex-direction:column;margin-top:4px}
.ov-item{display:flex;align-items:center;justify-content:flex-start;gap:14px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 2px;min-height:48px;font-size:16px}
.ov-item:disabled{cursor:default}
.ov-box{flex:none;display:grid;place-items:center;width:26px;height:26px;border:2px solid var(--ink-2);border-radius:6px}
.ov-box svg{width:16px;height:16px;opacity:0}
.ov-item[aria-checked="true"] .ov-box{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.ov-item[aria-checked="true"] .ov-box svg{opacity:1}
.ov-item[aria-checked="true"] .ov-name{text-decoration:line-through;color:var(--ink-2)}
.ov-name{overflow-wrap:anywhere}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);border:1px solid var(--line);border-radius:99px;padding:3px 10px;background:var(--surface)}
.status i{width:7px;height:7px;border-radius:50%;background:var(--ink-2)}
.status.ok i{background:var(--ok)}
.people{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pf{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px 6px 10px;min-height:36px}
.pf .dot{width:12px;height:12px}
.pf[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 20%,var(--surface));font-weight:600}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}

/* Hinweise */
.banners{display:flex;flex-direction:column;gap:8px;margin:4px 0 10px}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font-size:13.5px}
.banner p{margin:0;flex:1 1 220px;min-width:0}

/* Buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;min-height:40px;font-weight:500}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:var(--surface)}
.btn.small{min-height:34px;padding:5px 12px;font-size:13.5px}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{display:grid;place-items:center;width:40px;height:40px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0}
.icon-btn svg{width:18px;height:18px}

/* Kalender */
.cal-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:6px 0 12px}
.cal-nav{display:flex;align-items:center;gap:8px;flex:1 1 100%}
.cal-nav h2{flex:1;text-align:center;font-size:19px;font-weight:700}
.cal-tools{display:flex;align-items:center;gap:8px;justify-content:space-between;flex:1 1 100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 16px;min-height:38px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-bottom:14px}
.wd{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);text-align:center;padding:2px 0 4px}
.day{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:54px;padding:4px 0;border:1.5px solid transparent;border-radius:10px;background:var(--surface);color:var(--ink)}
.day.out{background:transparent;color:var(--ink-2);opacity:.65}
.day.sel{border-color:var(--ink)}
.num{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;font-variant-numeric:tabular-nums;font-size:14px}
.day.today{background:color-mix(in srgb,var(--today) 16%,var(--surface))}
.day.today .num{background:var(--today);color:var(--on-today);font-weight:700;width:30px;height:30px;font-size:16px}
.dots{display:flex;gap:3px;height:7px}
.dots .dot{width:7px;height:7px}
.dayblock{margin-bottom:16px}
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.dayhead h3{font-size:16px;font-weight:700}
.dayhead-left{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;min-width:0}
.kita{display:flex;gap:6px}
.kbtn{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--ink-2);background:transparent;border-radius:99px;padding:3px 11px 3px 8px;min-height:34px;font-size:13px;color:var(--ink-2)}
.kbtn svg{width:16px;height:16px;flex:none}
.kbtn.set{border:1px solid var(--c);background:color-mix(in srgb,var(--c) 28%,var(--surface));color:var(--ink);font-weight:600}
.kbtn:disabled{cursor:default}
.dayhead .heute{font-family:var(--f-body);font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:var(--today);color:var(--on-today);border-radius:99px;padding:2px 8px;margin-left:8px;vertical-align:2px}
.dayblock.is-today .dayhead{background:color-mix(in srgb,var(--today) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--today) 45%,var(--line));border-radius:12px;padding:8px 10px}
.dayblock.is-today .dayhead h3{font-size:18px}
.free{color:var(--ink-2);font-size:13.5px;margin:0 0 4px}
.evlist{display:flex;flex-direction:column;gap:8px}
.ev{display:grid;grid-template-columns:5.2rem minmax(0,1fr);text-align:left;width:100%;padding:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;overflow:hidden}
.ev-time{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1px;padding:10px 6px;background:color-mix(in srgb,var(--c) 24%,var(--surface));font-variant-numeric:tabular-nums}
.ev-time .t1{font-weight:600;font-size:15px}
.ev-time .t2{font-size:12px;color:var(--ink-2)}
.ev-main{display:flex;flex-direction:column;gap:5px;padding:10px 12px;min-width:0}
.ev-title{font-weight:600;overflow-wrap:anywhere}
.ev-note{font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:12.5px;color:var(--ink-2)}
.who{display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.tag{border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:12px;line-height:1.6}
.tag.ex{border-style:dashed}

/* Listen */
.section-title{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:600;margin:18px 0 8px}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:8px 8px 8px 10px;border:1px solid var(--line);background:var(--surface);border-radius:12px}
.chk{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:2px solid var(--ink-2);background:transparent;padding:0}
.chk svg{width:14px;height:14px;opacity:0}
.chk.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chk.on svg{opacity:1}
.row-main{display:flex;flex-direction:column;gap:4px;text-align:left;border:0;background:transparent;padding:4px 0;min-width:0}
.row-title{font-weight:500;overflow-wrap:anywhere}
.row.done .row-title{text-decoration:line-through;color:var(--ink-2)}
.late{color:var(--warn);font-weight:600}
.empty{border:1px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--ink-2)}
.empty strong{display:block;color:var(--ink);font-family:var(--f-display);font-size:16px;margin-bottom:2px}
.linkish{border:0;background:transparent;padding:8px 0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-weight:500}

/* Einkauf */
.shop-form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin:6px 0 10px}
.shop-form input,.shop-form select,.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;min-height:42px;width:100%}
.shop-form select{grid-column:1 / 2}
.shop-form .btn{grid-row:1;grid-column:2}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;min-height:34px;font-size:14px}
.nbtn{display:grid;place-items:center;width:40px;height:40px;padding:0;border:1px dashed var(--ink-2);border-radius:10px;background:transparent;color:var(--ink-2)}
.nbtn svg{width:20px;height:20px}
.nbtn.has{border:1px solid var(--line);background:var(--surface-2);color:var(--ink)}
.nbtn[aria-expanded="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.task{display:flex;flex-direction:column}
.note-prev{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin:-4px 6px 0;padding:14px 12px 10px;border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;background:var(--surface-2)}
.note-text{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:14px}
.item-x{width:34px;height:34px;border:0;background:transparent;border-radius:8px;color:var(--ink-2);padding:0;display:grid;place-items:center}
.item-x svg{width:16px;height:16px}

/* Navigation unten */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;border-radius:10px;padding:6px 4px;min-height:52px;color:var(--ink-2);font-size:12.5px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--ink);font-weight:600;background:var(--surface-2)}
.badge{position:absolute;top:2px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--ink);color:var(--bg);font-size:11px;font-weight:600;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.fab{position:fixed;z-index:24;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));
  display:inline-flex;align-items:center;gap:8px;border:0;border-radius:99px;background:var(--ink);color:var(--bg);font-weight:600;padding:0 20px 0 16px;min-height:50px;box-shadow:0 6px 18px var(--shadow)}
.fab svg{width:20px;height:20px}

/* Blatt */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:rgba(10,16,13,.5)}
.panel{position:relative;width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  box-shadow:0 -8px 30px var(--shadow);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.panel-head h2{font-size:20px;font-weight:700}
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .lbl{font-size:13px;font-weight:600;color:var(--ink-2)}
.field textarea{resize:vertical;min-height:64px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pchoices{display:flex;flex-wrap:wrap;gap:8px}
.pchoice{position:relative}
.pchoice input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.pchoice span{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:99px;padding:7px 14px 7px 10px;min-height:38px;background:var(--surface)}
.pchoice input:checked + span{border-color:var(--c);background:color-mix(in srgb,var(--c) 22%,var(--surface));font-weight:600}
.pchoice input:focus-visible + span{outline:2px solid var(--ink);outline-offset:2px}
.err{color:var(--danger);font-size:13px;margin:0}
.actions{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:4px}
.actions .right{display:flex;gap:10px;margin-left:auto}
.toast{position:fixed;z-index:50;left:50%;transform:translateX(-50%);bottom:calc(138px + env(safe-area-inset-bottom,0px));max-width:min(92vw,460px);background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 16px;font-size:14px;box-shadow:0 6px 18px var(--shadow)}
@media (prefers-reduced-motion: reduce){.panel{animation:none}}
@media (min-width:640px){.sheet{align-items:center}.panel{border-radius:18px}}

/* Anmeldung und Menü */
.top-right{display:inline-flex;align-items:center;gap:8px}
.top-right .icon-btn{width:34px;height:34px;border-radius:99px}
.top-right .icon-btn svg{width:16px;height:16px}
.login{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:var(--bg);overflow:auto;
  padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.login-card{width:100%;max-width:400px;display:flex;flex-direction:column;gap:16px}
.login-card h1{font-size:30px;font-weight:700;letter-spacing:-.01em}
.login-card p{margin:0}
.login-dots{display:flex;gap:8px}
.login-dots .dot{width:14px;height:14px}
.login-card .linkish{align-self:flex-start}
.login-card .muted-note{color:var(--ink-2);font-size:13.5px}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="top-row">
      <div class="title-group">
        <h1 id="app-title">Familienplaner</h1>
        <button type="button" class="btn small" id="overview-btn" hidden>Gesamtliste</button>
      </div>
      <span class="top-right">
        <span class="status" id="status" role="status"><i></i><span id="status-text">Lädt …</span></span>
        <button type="button" class="icon-btn" id="more-btn" aria-label="Menü" hidden><svg viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></button>
      </span>
    </div>
    <div class="people" id="people" role="group" aria-label="Nach Person filtern"></div>
  </header>

  <div class="banners" id="banners"></div>

  <main>
    <section id="v-kalender" aria-label="Kalender" hidden>
      <div class="cal-bar">
        <div class="cal-nav">
          <button type="button" class="icon-btn" id="prev" aria-label="Zurück"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
          <h2 id="cal-title"></h2>
          <button type="button" class="icon-btn" id="next" aria-label="Weiter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
        </div>
        <div class="cal-tools">
          <div class="seg" role="group" aria-label="Ansicht">
            <button type="button" id="m-monat" aria-pressed="true">Monat</button>
            <button type="button" id="m-woche" aria-pressed="false">Woche</button>
          </div>
          <button type="button" class="btn" id="today">Heute</button>
        </div>
      </div>
      <div class="month" id="month"></div>
      <div id="agenda"></div>
    </section>

    <section id="v-aufgaben" aria-label="Aufgaben" hidden>
      <div id="tasks-list"></div>
    </section>

    <section id="v-einkauf" aria-label="Einkaufsliste" hidden>
      <form class="shop-form" id="shop-form" autocomplete="off">

<script>
(function(){

/* ---------- Stammdaten ---------- */

/* ---------- Zustand ---------- */

var CFG={

/* ---------- Hilfen ---------- */
function $(id){return document.getElementById(id);}

    if(k==='class')el.className=v;

  return el;
}
function svg(inner,sw){var s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 24 24');s.setAttribute('fill','none');s.setAttribute('stroke','currentColor');s.setAttribute('stroke-width',sw||'2.6');s.setAttribute('stroke-linecap','round');s.setAttribute('stroke-linejoin','round');s.setAttribute('aria-hidden','true');s.innerHTML=inner;return s;}

function prefGet(k,d){try{var v=localStorage.getItem('fp-pref-'+k);return v==null?d:v;}catch(e){return d;}}

/* ---------- Datum ---------- */
function pad(n){return (n<10?'0':'')+n;}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d);}
function addMonths(s,n){var d=parse(s);var day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);var dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,dim));return iso(d);}
function dow(s){var g=parse(s).getDay();return g===0?7:g;}
function weekStart(s){return addDays(s,1-dow(s));}
function isoWeek(s){var p=s.split('-');var d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));var n=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-n);var y0=new Date(Date.UTC(d.getUTCFullYear(),0,1));return Math.ceil(((d-y0)/86400000+1)/7);}
function fmtShort(s){var d=parse(s);return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.';}
var WD=['Mo','Di','Mi','Do','Fr','Sa','So'];
var DF_MONTH=new Intl.DateTimeFormat('de-DE',{month:'long',year:'numeric'});
var DF_DAY=new Intl.DateTimeFormat('de-DE',{weekday:'long',day:'numeric',month:'long'});
function today(){return iso(new Date());}

/* ---------- Termine berechnen ---------- */
function occurs(ev,d){
  if(!ev.date)return false;
  switch(ev.repeat){
    case 'weekly':return d>=ev.date&&dow(d)===dow(ev.date);
    case 'weekdays':return d>=ev.date&&dow(d)<=5;
    case 'yearly':return d>=ev.date&&d.slice(5)===ev.date.slice(5);
    default:return ev.date===d;
  }
}
function passes(person){
  var any=false,hit=false;
  PEOPLE.forEach(function(p){if(UI.filter[p.id]){any=true;if(person===p.id)hit=true;}});
  return !any||hit||person==='alle';
}
function eventsOn(d){
  var out=[];
  Object.keys(S.events).forEach(function(id){
    var ev=S.events[id];
    if(occurs(ev,d)&&passes(ev.person))out.push(Object.assign({id:id},ev));
  });
  out.sort(function(a,b){
    var as=a.start||'',bs=b.start||'';
    if(as!==bs)return as<bs?-1:1;
    return (a.title||'').localeCompare(b.title||'','de');
  });
  return out;
}

/* ---------- Speichern ---------- */
function onWriteError(e){
  var c=e&&e.code;
  if(c==='permission-denied'){S.canWrite=false;S.denied=true;render();toast('Speichern nicht möglich. Bitte melde dich mit der freigegebenen E-Mail-Adresse an.');}
  else if(c==='resource-exhausted'){toast('Der Speicher ist voll. Bitte erst alte Einträge löschen.');}
  else{toast('Speichern hat nicht geklappt. Bitte noch einmal versuchen.');}
}
function save(col,id,data){
  if(!db)return Promise.resolve();
  return db.collection(col).doc(id).set(data).catch(onWriteError);
}
function patch(col,id,fields){
  var cur=S[col][id];if(!cur)return Promise.resolve();
  return save(col,id,Object.assign({},cur,fields));
}
function remove(col,id){
  if(!db)return Promise.resolve();
  return db.collection(col).doc(id).delete().catch(onWriteError);
}
function removeMany(list){
  return list.reduce(function(p,x){return p.then(function(){return remove(x[0],x[1]);});},Promise.resolve());
}

/* ---------- Anzeige: Kopf ---------- */

  $('more-btn').hidden=!S.user;
  var openT=0;Object.keys(S.tasks).forEach(function(id){if(!S.tasks[id].done)openT++;});
  var openI=0;Object.keys(S.items).forEach(function(id){if(!S.items[id].done)openI++;});
  setBadge('b-aufgaben',openT);setBadge('b-einkauf',openI);
}

function renderBanners(){
  var box=$('banners');clear(box);
  function add(text,actionLabel,fn){box.appendChild(h('div',{class:'banner'},[h('p',{text:text}),actionLabel?h('button',{type:'button',class:'btn small',onclick:fn,text:actionLabel}):null]));}
  if(S.denied)add('Dieses Konto hat keinen Zugriff auf den Familienplaner. Bitte melde dich mit der freigegebenen E-Mail-Adresse an.','Abmelden',signOut);
  if(S.mode==='shared'&&navigator.onLine===false)add('Du bist offline. Änderungen werden gespeichert, sobald wieder Internet da ist.');

}

  var out=[];['events','tasks','items'].forEach(function(c){Object.keys(S[c]).forEach(function(id){if(S[c][id].example)out.push([c,id]);});});

/* ---------- Kita: wer bringt, wer holt ---------- */
var KITA_CYCLE=['','koala','loewin'];
function iconKita(field){
  var door='<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>';
  return field==='bring'
    ?svg(door+'<path d="M10 17l5-5-5-5M15 12H3"/>','2.2')
    :svg('<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/>','2.2');
}
function setKita(d,field){
  var cur=S.kita[d]||{};
  var next={bring:cur.bring||'',hol:cur.hol||''};
  next[field]=KITA_CYCLE[(KITA_CYCLE.indexOf(cur[field]||'')+1)%KITA_CYCLE.length];
  if(!next.bring&&!next.hol)return remove('kita',d);
  return save('kita',d,next);
}
function kitaBtn(d,field){

/* ---------- Anzeige: Kalender ---------- */
function who(p){return h('span',{class:'who p-'+p.id},[h('span',{class:'dot'}),p.name]);}
function evRow(ev){
  var p=P(ev.person);
  var time=ev.start?[h('span',{class:'t1',text:ev.start}),ev.end?h('span',{class:'t2',text:'bis '+ev.end}):null]:[h('span',{class:'t1',text:'ganztägig'})];

function dayBlock(d,single){
  var list=eventsOn(d);

      h('h3',{},[title,isToday?h('span',{class:'heute',text:'Heute'}):null]),

  return h('div',{class:'dayblock'+(isToday?' is-today':'')},[head,body]);
}
function buildMonth(box){
  clear(box);
  WD.forEach(function(w){box.appendChild(h('div',{class:'wd',text:w}));});
  var first=parse(UI.sel);first.setDate(1);
  var offset=(first.getDay()+6)%7;
  var dim=new Date(first.getFullYear(),first.getMonth()+1,0).getDate();
  var rows=Math.ceil((offset+dim)/7);
  var startIso=addDays(iso(first),-offset);
  var curMonth=first.getMonth();
  for(var i=0;i<rows*7;i++){
    var d=addDays(startIso,i);
    var dd=parse(d);
    var seen={};var dots=[];
    eventsOn(d).forEach(function(ev){var pid=ev.person||'alle';if(!seen[pid]){seen[pid]=1;dots.push(h('span',{class:'dot p-'+pid}));}});
    var cls='day'+(dd.getMonth()!==curMonth?' out':'')+(d===UI.sel?' sel':'')+(d===today()?' today':'');
    (function(dIso){
      box.appendChild(h('button',{type:'button',class:cls,'aria-label':cap(DF_DAY.format(parse(dIso))),'aria-pressed':dIso===UI.sel?'true':'false',onclick:function(){UI.sel=dIso;render();}},[
        h('span',{class:'num',text:String(dd.getDate())}),
        h('span',{class:'dots'},dots.slice(0,3))
      ]));
    })(d);
  }
}
function renderCal(){
  var month=$('month'),agenda=$('agenda');

  var ws=weekStart(UI.sel);
  $('cal-title').textContent=m?cap(DF_MONTH.format(parse(UI.sel))):'KW '+isoWeek(ws)+' · '+fmtShort(ws)+'–'+fmtShort(addDays(ws,6));
  if(!S.loaded){month.hidden=true;agenda.appendChild(h('p',{class:'muted',text:'Lädt …'}));return;}
  if(!Object.keys(S.events).length){
    agenda.appendChild(h('div',{class:'empty'},[h('strong',{text:'Noch keine Termine'}),S.canWrite?'Mit „Termin“ unten rechts legst du den ersten an, zum Beispiel Kita bringen.':'Sobald jemand Termine einträgt, erscheinen sie hier.']));
  }
  if(m){month.hidden=false;buildMonth(month);agenda.appendChild(dayBlock(UI.sel,true));}
  else{month.hidden=true;for(var i=0;i<7;i++)agenda.appendChild(dayBlock(addDays(ws,i),false));}
}

  if(t.due===td)return h('span',{class:'late',text:'heute fällig'});

function showLogin(msg,info){

}
function hideLogin(){$('login').hidden=true;$('login-pass').value='';$('login-err').hidden=true;}
function authMessage(e){
  var c=(e&&e.code)||'';
  if(c==='auth/invalid-credential'||c==='auth/wrong-password'||c==='auth/user-not-found'||c==='auth/invalid-email')return 'E-Mail-Adresse oder Passwort stimmt nicht.';
  if(c==='auth/too-many-requests')return 'Zu viele Versuche. Bitte warte einige Minuten oder setze das Passwort zurück.';
  if(c==='auth/network-request-failed')return 'Keine Verbindung. Bitte prüfe das Internet.';
  if(c==='auth/user-disabled')return 'Dieses Konto ist gesperrt.';
  return 'Die Anmeldung hat nicht geklappt. Bitte versuche es noch einmal.';
}
$('login-form').addEventListener('submit',function(e){
  e.preventDefault();
  var mail=$('login-mail').value.trim(),pw=$('login-pass').value;
  if(!mail||!pw){showLogin('Bitte gib E-Mail-Adresse und Passwort ein.');return;}
  if(!auth){showLogin('Die Verbindung zu Firebase fehlt. Bitte lade die Seite neu.');return;}
  $('login-go').disabled=true;
  auth.signInWithEmailAndPassword(mail,pw).then(function(){$('login-go').disabled=false;},function(err){$('login-go').disabled=false;showLogin(authMessage(err));});
});
$('login-reset').addEventListener('click',function(){
  var mail=$('login-mail').value.trim();
  if(!mail){showLogin('Trage zuerst deine E-Mail-Adresse ein. Danach schickt Firebase dir einen Link zum Zurücksetzen.');return;}
  if(!auth){showLogin('Die Verbindung zu Firebase fehlt. Bitte lade die Seite neu.');return;}
  auth.sendPasswordResetEmail(mail).then(function(){
    showLogin('Wenn zu dieser Adresse ein Konto gehört, ist eine E-Mail mit dem Link unterwegs. Schau auch im Spam-Ordner nach.',true);
  },function(err){showLogin(authMessage(err));});
});
function signOut(){
  var done=function(){location.reload();};
  stopSubs();
  try{
    auth.signOut().then(function(){return fs.terminate();}).then(function(){return fs.clearPersistence();}).then(done,done);
  }catch(e){done();}
}

  COLS.forEach(function(c){data[c]=S[c];});
  var blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download='familienplaner-sicherung-'+today()+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},4000);
  toast('Die Sicherung wird heruntergeladen.');
}
function readImport(file){
  if(file.size>2*1024*1024){toast('Die Datei ist zu groß.');return;}
  var r=new FileReader();
  r.onerror=function(){toast('Die Datei konnte nicht gelesen werden.');};
  r.onload=function(){
    var data;
    try{data=JSON.parse(String(r.result));}catch(e){toast('Die Datei ist keine gültige Sicherung.');return;}
    if(!data||typeof data!=='object'||Array.isArray(data)){toast('Die Datei ist keine gültige Sicherung.');return;}
    var plan={},total=0,idOk=/^[A-Za-z0-9_\-.~:@+]{1,200}$/;
    COLS.forEach(function(c){
      plan[c]=[];
      var src=data[c];
      if(src&&typeof src==='object'&&!Array.isArray(src)){
        Object.keys(src).forEach(function(id){
          var v=src[id];
          if(idOk.test(id)&&v&&typeof v==='object'&&!Array.isArray(v)&&!v.example){plan[c].push([id,v]);total++;}
        });
      }
    });
    if(!total){toast('In der Datei sind keine Einträge zum Einlesen.');return;}
    confirmImport(plan);
  };
  r.readAsText(file);
}
function runImport(plan){
  var ops=[];
  COLS.forEach(function(c){plan[c].forEach(function(p){ops.push([c,p[0],p[1]]);});});
  var i=0;
  function next(){
    if(i>=ops.length)return Promise.resolve();
    var b=fs.batch(),n=0;
    while(i<ops.length&&n<400){var o=ops[i];b.set(fsRoot.collection(o[0]).doc(o[1]),o[2]);i++;n++;}
    return b.commit().then(next);
  }
  return next();
}
function confirmImport(plan){
  var parts=[plan.events.length+' Termine',plan.tasks.length+' Aufgaben',plan.items.length+' Einkaufsartikel',plan.kita.length+' Kita-Tage'];
  var go=h('button',{type:'button',class:'btn primary',text:'Jetzt einlesen'});
  go.addEventListener('click',function(){
    go.disabled=true;go.textContent='Wird eingelesen …';
    runImport(plan).then(function(){closeSheet();toast('Die Einträge wurden eingelesen.');},function(e){
      go.disabled=false;go.textContent='Jetzt einlesen';
      toast(e&&e.code==='permission-denied'?'Keine Berechtigung zum Speichern.':'Das Einlesen hat nicht geklappt.');
    });
  });
  var box=h('div',{class:'form'},[
    h('p',{style:'margin:0',text:'In der Datei stehen '+parts.join(', ')+'.'}),
    h('p',{class:'muted',style:'margin:0',text:'Einträge, die es schon gibt, werden dabei überschrieben. Alle anderen bleiben unverändert.'}),
    h('div',{class:'actions'},[h('span'),h('div',{class:'right'},[h('button',{type:'button',class:'btn',text:'Abbrechen',onclick:closeSheet}),go])])
  ]);
  openSheet('Sicherung einlesen',box,null);
}
function openMore(){
  var mail=S.user&&S.user.email?S.user.email:'';
  var fileIn=h('input',{type:'file',id:'imp-file',accept:'application/json,.json',hidden:true});
  fileIn.addEventListener('change',function(){if(fileIn.files&&fileIn.files[0])readImport(fileIn.files[0]);});
  var box=h('div',{class:'form'},[
    h('p',{class:'muted',style:'margin:0;overflow-wrap:anywhere',text:'Angemeldet als '+mail}),
    h('button',{type:'button',class:'btn',onclick:exportData,text:'Sicherung herunterladen'}),
    h('button',{type:'button',class:'btn',onclick:function(){fileIn.click();},text:'Sicherung einlesen'}),
    fileIn,
    h('button',{type:'button',class:'btn danger',onclick:signOut,text:'Abmelden'})
  ]);
  openSheet('Menü',box,null);
}
$('more-btn').addEventListener('click',openMore);

/* ---------- Start von Firebase ---------- */
(function init(){
  try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});}catch(e){}
  window.addEventListener('online',scheduleRender);
  window.addEventListener('offline',scheduleRender);
  if(!window.firebase||!firebase.initializeApp){
    render();showLogin('Firebase konnte nicht geladen werden. Bitte prüfe das Internet und lade die Seite neu.');return;
  }
  firebase.initializeApp(CFG);
  auth=firebase.auth();
  fs=firebase.firestore();
  try{var pr=fs.enablePersistence({synchronizeTabs:true});if(pr&&pr.catch)pr.catch(function(){});}catch(e){}
  fsRoot=fs.collection('familie').doc('main');
  db={collection:function(c){return fsRoot.collection(c);}};
  auth.onAuthStateChanged(function(user){
    if(user){
      S.user=user;S.mode='shared';S.loaded=false;
      hideLogin();subscribeAll();render();
    }else{
      S.user=null;S.mode='loading';S.loaded=false;S.denied=false;S.canWrite=true;
      stopSubs();COLS.forEach(function(c){S[c]={};});
      showLogin('');render();
    }
  });
})();
})();
</script>
